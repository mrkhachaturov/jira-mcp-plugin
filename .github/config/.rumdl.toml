[MD013]
# Prose wraps where the author put it; the rendered page is what matters.
enabled = false

[MD033]
# README uses <details> for collapsible sections, which markdown has no syntax for.
enabled = false

[global]
# CLAUDE.md is a one-line @-include, not a document.
exclude = ["CLAUDE.md"]

[MD060]
enabled = true
style = "aligned"
